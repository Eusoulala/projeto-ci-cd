<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --papel: #e9eff6;
      --quadriculado: #d5dfec;
      --folha: #ffffff;
      --tinta: #1d3c8f;
      --texto: #26303d;
      --pauta: #c9d8ee;
      --margem: #e59a9a;
      --carimbo: #1f7a4d;
      --erro: #b42318;
      --recuo: 4.5rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 56px 16px;
      font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
      font-size: 1.0625rem;
      color: var(--texto);
      background-color: var(--papel);
      background-image:
        linear-gradient(var(--quadriculado) 1px, transparent 1px),
        linear-gradient(90deg, var(--quadriculado) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* A folha do caderno, com a margem vermelha à esquerda */
    .folha {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 32px 32px var(--recuo);
      background:
        linear-gradient(90deg,
          transparent calc(var(--recuo) - 20px),
          var(--margem) calc(var(--recuo) - 20px),
          var(--margem) calc(var(--recuo) - 18px),
          transparent calc(var(--recuo) - 18px)),
        var(--folha);
      border: 1px solid #c3cfdf;
      box-shadow: 6px 6px 0 #c3cfdf;
    }

    header { padding-right: 150px; }

    h1 {
      margin: 0;
      font-size: 2.25rem;
      line-height: 1.1;
      color: var(--tinta);
    }

    .subtitulo {
      margin: 8px 0 28px;
      color: #5a6577;
    }

    /* O carimbo com a versão publicada */
    .carimbo {
      position: absolute;
      top: 28px;
      right: 24px;
      padding: 6px 12px 8px;
      border: 4px double var(--carimbo);
      border-radius: 6px;
      color: var(--carimbo);
      text-align: center;
      line-height: 1.15;
      transform: rotate(-8deg);
      filter: url(#tinta-de-carimbo);
      opacity: 0;
    }
    .carimbo.aplicado { opacity: 0.9; animation: carimbar 420ms cubic-bezier(.2, 1.4, .4, 1); }
    .carimbo-rotulo { display: block; font-size: 0.95rem; }
    .carimbo-versao { display: block; font-size: 1.4rem; font-weight: 700; letter-spacing: 0.06em; }

    @keyframes carimbar {
      from { opacity: 0; transform: rotate(-14deg) scale(1.7); }
      to   { opacity: 0.9; transform: rotate(-8deg) scale(1); }
    }

    form { display: flex; gap: 8px; }

    label.oculto {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font: inherit;
      color: var(--texto);
      border: 2px solid var(--pauta);
      border-radius: 6px;
      background: #fff;
    }

    button {
      padding: 10px 18px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--tinta);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #16307a; }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #f2b705;
      outline-offset: 2px;
    }

    #erro {
      min-height: 1.5em;
      margin: 10px 0 6px;
      color: var(--erro);
    }

    /* As tarefas escritas à mão nas linhas do caderno */
    #lista {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--pauta);
    }
    #lista li {
      padding: 6px 0;
      border-bottom: 1px solid var(--pauta);
      font-family: 'Kalam', cursive;
      font-size: 1.4rem;
      line-height: 1.6;
      color: var(--tinta);
    }
    #lista li.vazia {
      font-family: inherit;
      font-size: 1rem;
      color: #7a8597;
    }

    .aviso {
      max-width: 560px;
      margin: 20px auto 0;
      font-size: 0.875rem;
      color: #5a6577;
      text-align: center;
    }

    @media (max-width: 520px) {
      :root { --recuo: 2.75rem; }
      .folha { padding: 96px 20px 24px var(--recuo); }
      header { padding-right: 0; }
      h1 { font-size: 1.85rem; }
      .carimbo { top: 18px; right: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .carimbo.aplicado { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Filtro que deixa a borda do carimbo com cara de tinta -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <filter id="tinta-de-carimbo">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="ruido" />
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="2" />
    </filter>
  </svg>

  <main class="folha">
    <header>
      <h1>Lista de Tarefas</h1>
            <p class="subtitulo">Esta frase chegou aqui pelo pipeline, ao vivo!</p>
    </header>

    <div id="carimbo" class="carimbo" aria-live="polite">
      <span id="carimbo-rotulo" class="carimbo-rotulo">publicado</span>
      <span id="versao" class="carimbo-versao">...</span>
    </div>

    <form id="formulario">
      <label class="oculto" for="titulo">Nova tarefa</label>
      <input id="titulo" placeholder="Nova tarefa" autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>
    <p id="erro" role="alert"></p>

    <ul id="lista" aria-live="polite"></ul>
  </main>

  <p class="aviso">As tarefas ficam na memória do servidor e somem quando ele reinicia.</p>

  <script>
    async function carregarTarefas() {
      const resposta = await fetch('/api/tarefas');
      const tarefas = await resposta.json();

      const lista = document.getElementById('lista');
      lista.innerHTML = '';

      if (tarefas.length === 0) {
        const vazia = document.createElement('li');
        vazia.className = 'vazia';
        vazia.textContent = 'Nenhuma tarefa por aqui. Escreva a primeira acima.';
        lista.appendChild(vazia);
        return;
      }

      for (const tarefa of tarefas) {
        const item = document.createElement('li');
        item.textContent = tarefa.titulo;
        lista.appendChild(item);
      }
    }

    document.getElementById('formulario').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const campo = document.getElementById('titulo');
      const erro = document.getElementById('erro');

      const resposta = await fetch('/api/tarefas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titulo: campo.value }),
      });

      if (!resposta.ok) {
        erro.textContent = (await resposta.json()).erro;
        return;
      }

      erro.textContent = '';
      campo.value = '';
      carregarTarefas();
    });

    // Mostra no carimbo qual versão (commit) está publicada
    fetch('/health')
      .then((resposta) => resposta.json())
      .then((dados) => {
        const local = dados.versao === 'local';
        document.getElementById('carimbo-rotulo').textContent = local ? 'versão' : 'publicado';
        document.getElementById('versao').textContent = local ? 'local' : dados.versao.slice(0, 7);
        document.getElementById('carimbo').classList.add('aplicado');
      });

    carregarTarefas();
  </script>
</body>
</html>
